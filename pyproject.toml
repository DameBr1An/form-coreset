[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "form-coreset"
version = "0.1.0a0"
description = "Form-aware visual coreset extraction for image collections and image-text training sets."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "FormCoreset contributors" }]
keywords = [
  "image-deduplication",
  "coreset",
  "dataset-curation",
  "pose",
  "form",
  "lora",
  "diffusion",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.26",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
anime = ["dghs-imgutils>=0.9", "onnxruntime>=1.17"]
subject = ["timm>=0.9", "torch>=2.0"]
mask = ["rembg>=2.0"]
embed = ["onnxruntime>=1.17", "timm>=0.9"]
ui = ["gradio>=4.44"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]
all = ["form-coreset[anime,subject,mask,ui]"]

[project.scripts]
form-coreset = "formcoreset.cli:app"

[project.urls]
Homepage = "https://github.com/DameBr1An/form-coreset"
Issues = "https://github.com/DameBr1An/form-coreset/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/formcoreset"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer uses function calls as defaults by design.
"src/formcoreset/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
